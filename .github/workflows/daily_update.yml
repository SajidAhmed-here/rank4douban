name: Daily Update

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/daily_update.yml
  schedule:
    # Daily at 12:00 UTC (18:00 Asia/Dhaka).
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install and check Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "import bs4, lxml, requests, cloudscraper, selenium, webdriver_manager"

      - name: Prepare browser for existing Selenium code
        # The runner provides Chrome. The code asks webdriver-manager for
        # Chromium, so expose the same browser under that name for version detection.
        run: |
          chrome_path="$(command -v google-chrome)"
          sudo ln -sf "$chrome_path" /usr/local/bin/chromium
          google-chrome --version
          chromium --version

      - name: Verify browser and matching driver
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager
          from webdriver_manager.core.os_manager import ChromeType

          options = Options()
          for argument in ('--headless=new', '--no-sandbox', '--disable-dev-shm-usage'):
              options.add_argument(argument)
          service = Service(ChromeDriverManager(chrome_type=ChromeType.CHROMIUM).install())
          with webdriver.Chrome(service=service, options=options) as driver:
              driver.get('data:text/html,<title>Browser check</title>')
              assert driver.title == 'Browser check', 'Browser startup check failed'
          PY

      - name: Refresh rankings independently and preserve unavailable sources
        # Each updater runs unchanged in its own process. A blocked source must
        # not discard successful updates or replace its previous CSV with an empty file.
        run: |
          python - <<'PY'
          import csv
          import os
          import subprocess
          import sys
          from pathlib import Path

          sources = (
              ('Douban', 'update_douban', '99_douban_top250.csv'),
              ('IMDb', 'update_imdb_top_250', '01_IMDbtop250.csv'),
              ('Bangumi', 'update_bgm_top_250', '06_Bangumitop250.csv'),
              ('Criterion', 'update_cclist', '03_CClist.csv'),
              ('Letterboxd', 'update_letterboxed_top_250', '08_letterboxed_top_250.csv'),
          )
          results = []
          successful = 0
          for name, function, filename in sources:
              path = Path('data') / filename
              previous = path.read_bytes()
              print(f'::group::Refresh {name}', flush=True)
              try:
                  subprocess.run(
                      [sys.executable, '-c', f'import update_snippets; update_snippets.{function}()'],
                      check=True, timeout=600,
                  )
                  with path.open(encoding='utf-8', newline='') as source:
                      reader = csv.DictReader(source)
                      rows = list(reader)
                      if not reader.fieldnames or 'dbid' not in reader.fieldnames:
                          raise ValueError('missing dbid column')
                      if reader.fieldnames[0] not in ('rank', 'spine'):
                          raise ValueError('missing rank or spine column')
                  if not rows:
                      raise ValueError('source returned an empty ranking')
                  if any(None in row or any(value is None for value in row.values()) for row in rows):
                      raise ValueError('source returned malformed CSV rows')
              except (subprocess.SubprocessError, OSError, ValueError, csv.Error) as error:
                  path.write_bytes(previous)
                  print(f'::warning::{name}: refresh failed; previous CSV retained. See source logs.')
                  print(f'{type(error).__name__}: {error}', flush=True)
                  results.append(f'| {name} | Unavailable; previous data retained |')
              else:
                  successful += 1
                  print(f'{path}: {len(rows)} rows', flush=True)
                  results.append(f'| {name} | Refreshed: {len(rows)} rows |')
              finally:
                  print('::endgroup::', flush=True)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('## Ranking refresh results\n\n| Source | Result |\n| --- | --- |\n')
              summary.write('\n'.join(results) + '\n')
          if not successful:
              raise SystemExit('All ranking sources failed; no data will be published.')
          PY

      - name: Build JSON data
        run: python build_data.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('snippets').glob('*.json')) + [Path('data.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: valid JSON')
          PY

      - name: Commit and push changed data
        env:
          UPDATE_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- data/*.csv snippets/*.json data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m ":arrow_up: Daily update at $(date -u +%F)"
          git push origin "HEAD:refs/heads/$UPDATE_BRANCH"

